<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>커피포차</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="app">

    <!-- 50% -->
    <section class="banner">
      <div class="banner-content">
        <span>☕</span>
        <h1>커피포차</h1>
        <p>즐기고, 도전하고, 커피를 받아가세요.</p>
      </div>
    </section>

    <!-- 25% -->
    <section class="games">

      <button class="game-button fun" data-game="fortune">
        <strong>🔮 오늘의 운세</strong>
        <small>재미게임</small>
      </button>

      <button class="game-button fun" data-game="random">
        <strong>🎲 행운 뽑기</strong>
        <small>재미게임</small>
      </button>

      <button class="game-button coffee" data-game="maze">
        <strong>🌀 미로</strong>
        <small>커피획득게임</small>
      </button>

      <button class="game-button coffee" data-game="button">
        <strong>👆 버튼 누르기</strong>
        <small>커피획득게임</small>
      </button>

    </section>

    <!-- 25% -->
    <footer>
      <div class="ieum">
        <span>IEUM</span>
        <small>함께 만드는 즐거움</small>
      </div>
    </footer>

  </main>

  <script src="./app.js"></script>
</body>
</html>
