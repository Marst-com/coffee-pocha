<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반응속도</title>
  <link rel="stylesheet" href="../page.css">
</head>
<body>
  <main class="sub-page">
    <a href="../index.html" class="back">← 커피포차</a>

    <section class="page">
      <div class="page-icon">🏓</div>

      <h1>반응속도</h1>
      <p>화면이 바뀌는 순간 최대한 빠르게 클릭하세요!</p>

      <button id="reactionButton" class="click-button" type="button">
        시작
      </button>

      <div class="result">
        반응속도:
        <strong id="score">-</strong> ms
      </div>

      <div id="status">
        버튼을 눌러 게임을 시작하세요.
      </div>

      <div id="nameArea" hidden>
        <h2>🎉 기록 측정 완료!</h2>
        <p>커피를 받을 이름을 입력해주세요.</p>

        <input
          id="nameInput"
          type="text"
          maxlength="30"
          placeholder="예: XX이맘"
          autocomplete="off"
        >

        <button id="receiveButton" class="main-action" type="button">
          ☕ 커피 받기
        </button>
      </div>

      <div id="completeArea" hidden>
        <h2>☕ 커피 획득!</h2>
        <p id="completeText"></p>

        <a href="../index.html" class="main-action">
          커피포차로 돌아가기
        </a>
      </div>
    </section>
  </main>

  <script type="module" src="./reaction.js"></script>
</body>
</html>
