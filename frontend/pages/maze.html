<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미로 탈출</title>
  <link rel="stylesheet" href="../page.css">
</head>
<body>
  <main class="sub-page">
    <a href="../index.html" class="back">← 커피포차</a>

    <section class="page">
      <div class="page-icon">🌀</div>

      <h1>미로 탈출</h1>
      <p>미로를 탈출하면 커피를 받을 수 있어요!</p>

      <div id="maze"></div>

      <div id="mazeControls" aria-label="미로 방향키">
        <button type="button" data-direction="up">▲</button>
        <div>
          <button type="button" data-direction="left">◀</button>
          <button type="button" data-direction="down">▼</button>
          <button type="button" data-direction="right">▶</button>
        </div>
      </div>

      <div class="result">
        이동: <strong id="moves">0</strong>회
      </div>

      <button id="startButton" class="main-action" type="button">
        게임 시작
      </button>

      <div id="nameArea" hidden>
        <h2>🎉 탈출 성공!</h2>
        <p>커피를 받을 이름을 입력해주세요.</p>

        <input
          id="nameInput"
          type="text"
          maxlength="30"
          placeholder="예: XX이맘"
          autocomplete="off"
        >

        <button id="receiveButton" class="main-action" type="button">
          ☕ 커피 받기
        </button>
      </div>

      <div id="completeArea" hidden>
        <h2>☕ 커피 획득!</h2>
        <p id="completeText"></p>

        <a href="../index.html" class="main-action">
          커피포차로 돌아가기
        </a>
      </div>
    </section>
  </main>

  <script type="module" src="./maze.js"></script>
</body>
</html>
