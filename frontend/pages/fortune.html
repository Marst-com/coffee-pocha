<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>오늘의 운세 - 커피포차</title>

  <link rel="stylesheet" href="../page.css">
</head>

<body class="sub-page">

<main class="page">

  <a href="../index.html" class="back">
    ← 메인으로
  </a>

  <div class="page-icon">🔮</div>

  <h1>오늘의 운세</h1>

  <p>원하는 방법으로 오늘의 운세를 확인해보세요.</p>


  <div class="fortune-tabs">

    <button onclick="openFortune('birthday')">
      🎂 생년월일
    </button>

    <button onclick="openFortune('tarot')">
      🃏 타로
    </button>

  </div>


  <!-- 생년월일 -->

  <section id="birthday" class="fortune-panel">

    <h2>🎂 생년월일 운세</h2>

    <p>생년월일을 입력하면 오늘의 운세를 확인할 수 있어요.</p>

    <input
      id="birthDate"
      type="date"
    >

    <button
      class="main-action"
      onclick="birthdayFortune()"
    >
      ✨ 운세 확인
    </button>

  </section>


  <!-- 타로 -->

  <section
    id="tarot"
    class="fortune-panel hidden"
  >

    <h2>🃏 오늘의 타로</h2>

    <p>
      아래 카드 중 하나를 직접 골라보세요.
    </p>


    <div class="tarot-table">

      <div
        class="tarot-card"
        onclick="pickCard(this, 0)"
      >
        <div class="card-back">✦</div>
      </div>

      <div
        class="tarot-card"
        onclick="pickCard(this, 1)"
      >
        <div class="card-back">☾</div>
      </div>

      <div
        class="tarot-card"
        onclick="pickCard(this, 2)"
      >
        <div class="card-back">✧</div>
      </div>

      <div
        class="tarot-card"
        onclick="pickCard(this, 3)"
      >
        <div class="card-back">♢</div>
      </div>

      <div
        class="tarot-card"
        onclick="pickCard(this, 4)"
      >
        <div class="card-back">☼</div>
      </div>

    </div>

  </section>


  <div id="result" class="fortune-result"></div>

</main>


<script>

const birthdayPanel =
  document.getElementById("birthday");

const tarotPanel =
  document.getElementById("tarot");

const result =
  document.getElementById("result");


function openFortune(type) {

  birthdayPanel.classList.toggle(
    "hidden",
    type !== "birthday"
  );

  tarotPanel.classList.toggle(
    "hidden",
    type !== "tarot"
  );

  result.innerHTML = "";

}


function birthdayFortune() {

  const date =
    document.getElementById("birthDate").value;

  if (!date) {

    result.innerHTML =
      "🎂 생년월일을 입력해주세요!";

    return;
  }


  const numbers =
    date.replaceAll("-", "")
      .split("")
      .map(Number);


  const total =
    numbers.reduce(
      (a, b) => a + b,
      0
    );


  const fortunes = [

    "오늘은 새로운 일을 시작하기 좋은 날이에요! ✨",

    "뜻밖의 행운이 찾아올 수 있어요! 🍀",

    "오늘은 사람들과 즐거운 시간을 보내기 좋은 날이에요! ☕",

    "집중력이 좋아지는 날이에요! 🎯",

    "작은 기회가 큰 즐거움으로 이어질 수 있어요! 🌟",

    "오늘의 행운 아이템은 커피입니다! ☕"

  ];


  result.innerHTML = `
    <div class="result-card">
      <span>🎂</span>
      <h3>오늘의 운세</h3>
      <p>${fortunes[total % fortunes.length]}</p>
    </div>
  `;

}


const tarotCards = [

  {
    name: "THE SUN",
    icon: "☀️",
    text: "밝은 에너지와 즐거운 일이 찾아오는 카드입니다."
  },

  {
    name: "THE STAR",
    icon: "⭐",
    text: "새로운 희망과 가능성을 의미하는 카드입니다."
  },

  {
    name: "THE MAGICIAN",
    icon: "🪄",
    text: "자신의 능력을 활용할 기회가 생길 수 있습니다."
  },

  {
    name: "THE WORLD",
    icon: "🌎",
    text: "하나의 일이 완성되고 새로운 단계로 넘어가는 카드입니다."
  },

  {
    name: "THE FOOL",
    icon: "🎒",
    text: "새로운 도전과 모험을 의미하는 카드입니다."
  }

];


function pickCard(element, index) {

  document
    .querySelectorAll(".tarot-card")
    .forEach(card => {
      card.classList.remove("selected");
    });


  element.classList.add("selected");


  const card =
    tarotCards[index];


  element.innerHTML = `
    <div class="card-front">
      <span>${card.icon}</span>
      <strong>${card.name}</strong>
    </div>
  `;


  result.innerHTML = `
    <div class="result-card">
      <h3>${card.icon} ${card.name}</h3>
      <p>${card.text}</p>
    </div>
  `;

}

</script>

</body>
</html>
