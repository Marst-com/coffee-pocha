<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>방명록 관리</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="wrap">
  <section id="gate" class="gate noprint">
    <h1>관리자</h1>
    <form id="gf">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
      <p class="err" id="gerr" role="alert"></p>
      <button class="pri" style="width:100%">들어가기</button>
    </form>
  </section>

  <section id="dash" hidden>
    <div class="noprint">
      <h1 id="title">방명록 관리</h1>
      <p class="sub" id="mode"></p>
    </div>
    <div class="print-head">
      <h1 id="pTitle"></h1>
      <p id="pTime"></p><p id="pCond"></p><p id="pSum"></p>
    </div>

    <div class="stats noprint" id="stats"></div>

    <div class="panel noprint">
      <div class="row">
        <select id="fg" aria-label="게임"><option value="all">모든 게임</option></select>
        <input class="grow" id="fq" placeholder="이름 또는 소감 검색" aria-label="검색">
      </div>
      <div class="row" style="margin-top:8px">
        <span class="grow"></span>
        <button id="xlsx" type="button">엑셀(.xlsx) 저장</button>
        <button id="json" type="button">JSON 저장</button>
        <button id="jcopy" type="button">JSON 복사</button>
        <button id="csv" type="button">CSV</button>
        <button id="print" type="button" class="pri">인쇄</button>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </div>

    <div class="tablebox">
      <table>
        <thead><tr><th>#</th><th>이름</th><th>소감</th><th>게임</th><th>점수</th><th>시간</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </section>
</div>
<script type="module" src="admin.js"></script>
</body>
</html>
